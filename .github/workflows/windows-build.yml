name: Build Windows portable app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable application
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\windows\build_windows.ps1
      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: OpenBattlegroundsOverlay-Windows
          path: dist/windows/OpenBattlegroundsOverlay-Windows.zip
          if-no-files-found: error
      - name: Attach Windows ZIP to the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME dist/windows/OpenBattlegroundsOverlay-Windows.zip --clobber
